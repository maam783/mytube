<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrivateTube</title>
<meta name="description" content="Ein privater YouTube-Feed ohne Shorts und ohne alte Videos.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PrivateTube">
<meta name="theme-color" content="#12141a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button class="brand" id="nav-feed" type="button">PrivateTube</button>
  <nav class="tabs">
    <a href="#/" data-tab="feed">Feed</a>
    <a href="#/channels" data-tab="channels">Kanäle</a>
    <a href="#/manifest" data-tab="manifest">Manifest</a>
    <a href="#/status" data-tab="status">Status</a>
    <a href="#/settings" data-tab="settings">Einstellungen</a>
  </nav>
  <button class="sync-btn" id="sync-btn" type="button">Aktualisieren</button>
</header>

<div class="progress" id="progress" hidden>
  <div class="progress-bar"><span id="progress-fill"></span></div>
  <span class="progress-text" id="progress-text"></span>
</div>

<main id="view" aria-live="polite"></main>

<div class="toast-host" id="toast-host"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
